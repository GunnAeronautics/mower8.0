; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:native]
platform = native
lib_deps = 
	unity
	adafruit/Adafruit NeoPixel@^1.15.4
test_framework = unity
test_build_src = yes
test_filter = test/*
build_src_filter = +<app.cpp> +<test/*.cpp>
build_flags = -std=c++17 -DTEST_MODE -Iinclude

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	adafruit/Adafruit BMP5xx Library@^1.0.2
	adafruit/Adafruit BNO055@^1.6.4
	madhephaestus/ESP32Servo@^3.0.6
	adafruit/Adafruit ADXL343@^1.6.4
	https://github.com/happylabdab2/Adafruit_BMP3XX.git
	adafruit/Adafruit NeoPixel@^1.15.4
