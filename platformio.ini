; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env]
test_framework = googletest

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

platform_packages =
    platformio/tool-qemu-riscv

test_testing_command =
    ${platformio.packages_dir}/tool-qemu-riscv/bin/qemu-system-riscv32
    -nographic
    -machine
    sifive_e
    -kernel
    ${platformio.build_dir}/${this.__env__}/firmware.elf
    --without-uploading

test_filter = test/*

lib_deps = 
	adafruit/Adafruit BMP5xx Library@^1.0.2
	adafruit/Adafruit BNO055@^1.6.4
	madhephaestus/ESP32Servo@^3.0.6
	adafruit/Adafruit ADXL343@^1.6.4
	https://github.com/happylabdab2/Adafruit_BMP3XX.git
	denyssene/SimpleKalmanFilter@^0.1.0
	adafruit/Adafruit BNO08x@^1.2.5
	googletest@1.17.0
